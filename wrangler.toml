name = "liarstown"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
account_id = "f3e8c129e4da616815cbd9d3b8c8dc5e"
workers_dev = true

routes = [
  { pattern = "liars.town", custom_domain = true },
  { pattern = "www.liars.town", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/api/*", "/ws/*", "/g/*", "/b/*", "/daily", "/leaderboard", "/docs", "/games", "/join", "/play"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Registry"]

[triggers]
crons = ["*/5 * * * *"]

[vars]
AMBIENT_INTERVAL_MIN = "20"
SITE_URL = "https://liars.town"

[observability]
enabled = true
